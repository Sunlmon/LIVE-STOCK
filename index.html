<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F1EFE8" />
    <title>活体滞销 — 清空屏幕</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main>
      <section class="intro-screen" id="intro-screen" aria-labelledby="intro-title">
        <header class="cover-header">
          <p class="eyebrow">AN INTERACTIVE EXPERIENCE <span>／</span> 01</p>
          <span class="cover-edition">SIX SPECIES · ONE SCREEN</span>
        </header>
        <div class="cover-content">
          <div class="cover-copy">
            <p class="cover-kicker">活 体 滞 销</p>
            <h1 id="intro-title">LIVE<br />STOCK<span class="title-period">.</span></h1>
            <p class="cover-description">一次关于「清空」的互动实验。</p>
            <div class="cover-action">
              <button class="start-button" id="start-button" type="button">
                <span>START</span><span class="start-arrow" aria-hidden="true">↗</span>
              </button>
              <p class="cover-start-hint">点击，开始领养</p>
            </div>
          </div>
          <div class="cover-art" aria-hidden="true">
            <div class="cover-orbit orbit-outer"></div>
            <div class="cover-orbit orbit-inner"></div>
            <div class="cover-animals" id="cover-animals"></div>
            <span class="cover-art-caption">EVERY LITTLE LIFE.</span>
          </div>
        </div>
        <footer class="cover-footer">
          <span>点击领养 · 看它们不断生长</span>
          <span>LIVE STOCK <span class="footer-dash">—</span> 活体滞销</span>
        </footer>
      </section>

      <section class="play-screen" id="play-screen" hidden aria-label="清空屏幕互动场景">
        <canvas id="animal-canvas" aria-label="点击动物，尝试将它们领养离开"></canvas>

        <header class="hud" aria-live="polite">
          <div class="hud-title">
            <p class="eyebrow">LIVE STOCK <span>／</span> 01</p>
            <h2>清空屏幕</h2>
            <p class="hint">通过点击将小动物都领养出去</p>
          </div>
          <div class="hud-data">
            <div class="counter"><span>屏幕中</span><strong id="animal-count">0</strong></div>
            <div class="counter adopted"><span>已领养</span><strong id="adopted-count">0</strong></div>
            <div class="density-meter" aria-label="画面密度">
              <span class="density-label">画面密度</span>
              <span class="density-track"><span id="density-fill"></span></span>
            </div>
          </div>
        </header>

        <div class="stage-placeholder" id="stage-placeholder" hidden>
          <p class="eyebrow">LIVE STOCK <span>／</span> WIP 02</p>
          <h2>动物数量太多了，<br />已经超越承受能力了。</h2>
          <button class="restart-button" id="restart-button" type="button">重新开始</button>
        </div>

        <p class="load-error" id="load-error" role="alert" hidden>
          动物图形未能载入。请通过本地网页服务器重新打开页面。
        </p>
      </section>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
